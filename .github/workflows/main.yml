name: Mining News Pipeline

on:
  schedule:
    - cron: '0 */4 * * *'   # every 4 hours
  workflow_dispatch:
    inputs:
      max_articles:
        description: 'Process at most this many deal candidates (empty = all). The rest are picked up by the next run.'
        required: false
        default: ''

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # the run commits the id of the last processed article
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install
        run: pip install .

      - name: Run the pipeline
        run: python orchestrator.py
        env:
          user: ${{ secrets.DB_USER }}
          password: ${{ secrets.DB_PASSWORD }}
          host: ${{ secrets.DB_HOST }}
          port: ${{ secrets.DB_PORT }}
          dbname: ${{ secrets.DB_NAME }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          MAX_ARTICLES: ${{ inputs.max_articles }}
          # Optional: send traces to a collector
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ vars.OTEL_EXPORTER_OTLP_ENDPOINT }}
          OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}

      - name: Keep the run report and the values withheld for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-output
          path: |
            run_report.json
            review_queue.jsonl
          if-no-files-found: ignore

      - name: Record the last processed article
        run: |
          if [ -n "$(git status --porcelain last_article_id.txt)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add last_article_id.txt
            git commit -m "Record last processed article ($(date -u +'%Y-%m-%d %H:%M') UTC)"
            git push
          fi
