name: Mining Articles Pipeline

on:
  push: # <--- NEW: Add this line
    branches: [ main ] # <--- NEW: Add this line to specify which branch pushes trigger
  schedule:
    - cron: '0 */1 * * *'  # Now runs at the top of every hour (or */2 if you revert)
  workflow_dispatch:          # Allows manual runs from the Actions tab

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers and dependencies
        run: python -m playwright install --with-deps

      - name: Run the entire pipeline
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python orchestrator.py