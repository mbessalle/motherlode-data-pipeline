[project]
name = "motherlode-data-pipeline"
version = "2.0.0"
description = "Mining M&A news to a structured deal database: LLM extraction with deterministic validation, LangGraph routing and OpenTelemetry tracing."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "langgraph>=1.2,<2",
    "openai>=3,<4",
    "opentelemetry-sdk>=1.45,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.45,<2",
    "pypdf>=7",
    "psycopg2-binary>=2.9",
    "pydantic>=2.7,<3",
    "python-dotenv>=1.0",
    "requests>=2.32",
    "trafilatura>=2.3",
]

[project.optional-dependencies]
dev = ["pytest>=9", "ruff>=0.17"]

[tool.setuptools.packages.find]
include = ["pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 130
extend-exclude = ["build"]   # created by `pip install .`
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"pipeline/prompts.py" = ["E501"]   # prompts are kept byte-for-byte
"pipeline/llm.py" = ["E501"]       # prompt text
"pipeline/sources.py" = ["E501"]   # request headers
"tests/*" = ["E501"]
"evals/*" = ["E501"]
